[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmd"
version = "0.1.0"
description = "任意源（散文件/有道云笔记导出/语雀 .lakebook）→ Markdown 批量转换"
requires-python = ">=3.11"
dependencies = [
  "markitdown[pdf]>=0.1.7",  # pdf extra（pdfminer.six 等）用于 PDF 转换器
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "pandas>=2",             # markitdown 的 xlsx/xls converter 依赖
  "requests>=2.28",        # MinerU 在线 API + 语雀图片下载
  "markdownify>=1.2",      # 语雀 HTML → Markdown
  "beautifulsoup4>=4.12",  # 语雀 HTML 解析（LaTeX/图片）
  "pyyaml>=6",             # 语雀 TOC 解析
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf-inspector = ["pdf-inspector"]   # 可选轻量纯文本后端

[project.scripts]
xmd = "xmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
